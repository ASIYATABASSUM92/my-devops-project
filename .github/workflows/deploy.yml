name: Deploy HTML to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # NEW: The Testing Stage
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run HTML Check
        run: |
          if grep -q "DevOps" index.html; then
            echo "Test Passed: The word 'DevOps' was found!"
          else
            echo "Test Failed: The word 'DevOps' is missing!"
            exit 1
          fi

  # UPDATED: The Deployment Stage
  deploy:
    needs: test # <-- This tells GitHub it CANNOT deploy unless the test passes!
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
